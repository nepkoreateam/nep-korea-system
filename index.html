/* NEP Korea branded design refresh */
:root{
  --b:#0f4fa8;
  --b2:#1c66d6;
  --bg:#eef3f8;
  --l:#d8e2ee;
  --text:#0f172a;
  --muted2:#475467;
  --surface:#ffffff;
  --soft:#f8fafc;
  --headerGrad:linear-gradient(135deg,#103f8c 0%,#1557c0 58%,#2d74e8 100%);
}
html,body{background:
  radial-gradient(circle at top left, rgba(21,87,192,.07), transparent 28%),
  linear-gradient(180deg,#edf3f9 0%,#f6f8fb 42%,#eef3f8 100%)!important;
  color:var(--text);
}
body{font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif!important;letter-spacing:-.1px}
main{max-width:1480px!important;padding:22px 18px 40px!important}
h1,h2,h3,h4{letter-spacing:-.4px;color:#0f172a}
.muted{color:#667085!important}
.card{
  background:var(--surface)!important;
  border:1px solid var(--l)!important;
  border-radius:20px!important;
  box-shadow:0 10px 28px rgba(15,23,42,.055)!important;
}
button,.smallbtn,.primary,.ghost,.green,.danger{
  border-radius:14px!important;
  font-weight:800!important;
  transition:all .16s ease;
}
button:hover,.smallbtn:hover{transform:translateY(-1px)}
.primary{background:var(--headerGrad)!important;border:none!important;color:#fff!important}
.ghost{background:#fff!important;border:1px solid var(--l)!important;color:#1f2937!important}
.green{background:#e9f8f1!important;border:1px solid #b7e4cb!important;color:#067647!important}
.danger{background:#fff1f3!important;border:1px solid #f5c2c7!important;color:#b42318!important}
input,select,textarea{
  border:1px solid #d7e1ec!important;
  border-radius:14px!important;
  background:#fff!important;
  color:#101828!important;
  padding:11px 13px!important;
  box-shadow:none!important;
}
input:focus,select:focus,textarea:focus{
  outline:none!important;
  border-color:#7eaef6!important;
  box-shadow:0 0 0 4px rgba(21,87,192,.08)!important;
}
table{
  border-collapse:separate!important;
  border-spacing:0!important;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--l);
  border-radius:16px;
}
th{
  background:#f7faff!important;
  color:#344054!important;
  font-weight:800!important;
  border-bottom:1px solid #e5edf5!important;
}
td{border-bottom:1px solid #eef2f6!important}
tr:last-child td{border-bottom:none!important}
.login.card{
  max-width:640px!important;
  margin:34px auto!important;
  padding:28px!important;
  border-radius:26px!important;
}
.nepLoginBrand{
  display:grid;
  grid-template-columns:82px 1fr;
  gap:16px;
  align-items:center;
  padding:4px 0 18px;
  margin-bottom:16px;
  border-bottom:1px solid #e8eef5;
}
.nepLoginMark,.nepBrandMark{
  width:82px;height:82px;border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  background:var(--headerGrad);
  color:#fff;font-size:29px;font-weight:950;letter-spacing:-1px;
  box-shadow:0 14px 24px rgba(21,87,192,.24);
}
.nepLoginKicker,.nepBrandKicker{

.nepLoginBrand h1{

const NEP_SERVER_MODE = location.protocol !== 'file:' && !location.hostname.endsWith('github.io') && !location.hostname.includes('githubusercontent.com');
let nepSaveTimer=null;

async function api(path, options={}){
  const res = await fetch(path, {
    credentials:'include',
    headers:{'Content-Type':'application/json', ...(options.headers||{})},
    ...options
  });
  let data=null;
  try{ data=await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data?.error || '요청에 실패했습니다.');
  return data;
}

async function loadSession(){
  if(!NEP_SERVER_MODE){
    // GitHub Pages/파일 테스트판에서는 서버 API 없이도 로그인되도록 샘플 데이터를 안전하게 적용합니다.
    db = seed();
    localStorage.setItem('nep_v16_account_work_simple', JSON.stringify(db));
    migrateBaseData();
    return;
  }
  try{
    const data=await api('/api/session');
    if(data?.user && data?.state){
      me=data.user;
      db=data.state;
      migrateBaseData();
      render();
    }
  }catch(e){
    // not logged in
  }
}

function save(){
  localStorage.setItem('nep_v16_account_work_simple', JSON.stringify(db));
  if(NEP_SERVER_MODE && me){
    clearTimeout(nepSaveTimer);
    nepSaveTimer=setTimeout(()=>{
      fetch('/api/state',{
        method:'POST',
        credentials:'include',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(db)
      }).catch(()=>alert('서버 저장에 실패했습니다. 네트워크를 확인해주세요.'));
    },300);
  }
}

async function login(){
  let id=loginId.value.trim(), pw=loginPw.value;
  if(!id||!pw){loginMsg.textContent='아이디와 비밀번호를 입력하세요.';return}
  if(NEP_SERVER_MODE){
    try{
      loginMsg.textContent='로그인 중입니다.';
      const data=await api('/api/login',{method:'POST',body:JSON.stringify({id,pw})});
      me=data.user; db=data.state; migrateBaseData(); loginMsg.textContent=''; render();
    }catch(e){loginMsg.textContent=e.message||'로그인에 실패했습니다.'}
    return;
  }
  let found=db.users.find(x=>x.id===id&&x.pw===pw);
  if(!found){loginMsg.textContent='아이디가 없거나 비밀번호가 맞지 않습니다.';return}

}

function goAdminTab(id){tab(id,tabBtnById(id))}
function u(id){return db.users.find(x=>x.id===id)||{}}
function c(id){return db.customers.find(x=>x.id===id)||{}}
function p(d,cid){
  let rows=db.pickups.filter(x=>x.date===d&&x.customerId===cid);
  if(!rows.length)return null;
  return rows.sort((a,b)=>String(b.time||'').localeCompare(String(a.time||'')))[0];
}
function calc(cu,liter){
  // 테스트판 금액 계산: 수거량 × 리터당 단가. 월 기본요금은 CMS/미납 화면의 expected 샘플값으로 따로 확인합니다.
  return Math.round(Number(liter||0)*Number(cu?.unitPrice||130));
}
function pickupReportText(cu,pp){
  if(!cu||!cu.id)return '-';
  if(pp&&pp.memo&&String(pp.memo).trim())return pp.memo;
  return '-';
}

function ensureOpsData(){db.closedMonths=Array.isArray(db.closedMonths)?db.closedMonths:[]; db.changeLogs=Array.isArray(db.changeLogs)?db.changeLogs:[]}
function monthCloseInfo(m){ensureOpsData(); return db.closedMonths.find(x=>x.month===m && !x.openedAt)}
function isMonthClosed(m){return !!monthCloseInfo(m)}
function addChangeLog(log){ensureOpsData(); db.changeLogs.unshift({id:'chg_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), at:new Date().toISOString(), userId:me?.id||'', userName:me?.name||'', ...log}); db.changeLogs=db.changeLogs.slice(0,1000)}

function onlyDate(v){if(!v)return '-'; try{return new Date(v).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'})}catch(e){return String(v).split(' ')[0]||v}}
function onlyTime(v){if(!v)return '-'; try{return new Date(v).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}catch(e){return String(v).split(' ')[1]||'-'}}

function changeLogText(x){
  if(x.type==='pickup_update') return `${x.customerName||x.customerId} 수거기록 수정 · ${x.oldStatus||''}/${x.oldLiter||0}L → ${x.newStatus||''}/${x.newLiter||0}L`;
  if(x.type==='pickup_create') return `${x.customerName||x.customerId} 수거기록 입력 · ${x.newStatus||''}/${x.newLiter||0}L`;
  if(x.type==='month_close') return `${x.month} 월마감`;
  if(x.type==='month_open') return `${x.month} 마감해제`;
  if(x.type==='cms_update') return `${x.customerName||x.customerId} ${x.detail||'CMS 상태 변경'}`;
  if(x.type==='ledger_send') return x.customerName ? `${x.customerName} 관리대장 발송` : (x.detail||'관리대장 발송');
  if(x.type==='customer_update'||x.type==='customer_create'||x.type==='customer_status'||x.type==='user_update') return x.detail||x.type;
  return x.detail||x.type||'기록';
}
async function closeMonth(){
  const m=document.getElementById('opsMonth')?.value||month;
  if(monthCloseInfo(m)) return alert('이미 마감된 월입니다.');
  const note=prompt(`${m} 월을 마감할까요?\n마감 후 기사 입력은 차단됩니다.\n\n메모가 있으면 입력하세요.`,'월말 관리대장 확정')||'';
  if(!confirm(`${m} 월을 마감합니다. 계속할까요?`))return;
  if(NEP_SERVER_MODE){
    const data=await api('/api/month-close',{method:'POST',body:JSON.stringify({month:m,note})});
    db=data.state; migrateBaseData();
  }else{
    ensureOpsData(); db.closedMonths.push({month:m,closedAt:new Date().toISOString(),closedBy:me.id,note}); addChangeLog({type:'month_close',month:m,reason:note});
  }
  save(); renderOps();
}
async function openMonth(){
  const m=document.getElementById('opsMonth')?.value||month;
  if(!monthCloseInfo(m)) return alert('마감된 월이 아닙니다.');
  const reason=prompt(`${m} 월 마감을 해제하는 사유를 입력하세요.`,'수정 필요')||'';
  if(!confirm(`${m} 월 마감을 해제할까요?`))return;
  if(NEP_SERVER_MODE){
    const data=await api('/api/month-open',{method:'POST',body:JSON.stringify({month:m,reason})});
    db=data.state; migrateBaseData();
  }else{
    db.closedMonths=db.closedMonths.filter(x=>x.month!==m); addChangeLog({type:'month_open',month:m,reason});
  }
  save(); renderOps();
}

function hasRouteTemplateForDay(driverId,d){
  let dk=dayKo(d);
  return db.customers.some(cu=>cu.active&&cu.routePlans&&cu.routePlans[dk]&&cu.routePlans[dk].driverId===driverId);
}
function ensureWeeklyRoutesForDate(d=today){
  const hasAny=db.assignments.some(a=>a.date===d);
  if(!hasAny){
    rebuildAssignmentsForDateFromRules(d,true);
    save();
    return;
  }
  let changed=false;
  activeDrivers().forEach(dr=>{
    let exists=db.assignments.some(a=>a.date===d&&a.driverId===dr.id);
    if(!exists && hasRouteTemplateForDay(dr.id,d)){
      let added=buildRouteForDriver(dr.id,d,false);
      if(added) changed=true;
    }
  });
  if(changed) save();
}

function activeDrivers(){return db.users.filter(x=>x.role==='driver'&&x.active)}
function migrateBaseData(){
  db.users=Array.isArray(db.users)?db.users:[];
  db.customers=Array.isArray(db.customers)?db.customers:[];
  db.assignments=Array.isArray(db.assignments)?db.assignments:[];
  db.pickups=Array.isArray(db.pickups)?db.pickups:[];
  db.customers.forEach((cu,idx)=>{
    cu.active = cu.active!==false;
    cu.routePlans = cu.routePlans || {};
    if(!cu.defaultDriverId){
      let days=String(cu.days||'');
      let firstPlan=Object.values(cu.routePlans||{}).find(x=>x&&x.driverId);
      if(firstPlan) cu.defaultDriverId=firstPlan.driverId;
    }
    if(!cu.routeOrder) cu.routeOrder = Number(Object.values(cu.routePlans||{})[0]?.order)||idx+1;
    if(cu.defaultDriverId && cu.days && !Object.keys(cu.routePlans||{}).length){
      applyCustomerRoutePlan(cu,cu.days,cu.defaultDriverId,cu.routeOrder||idx+1);
    }
  });
  ensureWeeklyRoutesForDate(today);
}
function makeDriverOptions(selected=''){
  const ds=activeDrivers();
  return `<option value="">담당기사 선택</option>`+ds.map(d=>`<option value="${d.id}" ${selected===d.id?'selected':''}>${htmlSafe(d.name)}</option>`).join('');
}
function daysArray(days){return String(days||'').replace(/매일/g,'월화수목금토일').split('').filter(d=>['월','화','수','목','금','토','일'].includes(d))}
function applyCustomerRoutePlan(cu,days,driverId,order){
  cu.routePlans={};
  if(driverId){
    daysArray(days).forEach(d=>{cu.routePlans[d]={driverId,order:Number(order)||999}});
  }
  cu.defaultDriverId=driverId||'';
  cu.routeOrder=Number(order)||999;
}
function routePlanFor(cu,d){let dk=dayKo(d); if(cu.routePlans&&cu.routePlans[dk]) return cu.routePlans[dk]; if(cu.defaultDriverId) return {driverId:cu.defaultDriverId,order:Number(cu.routeOrder)||9999}; return null}
function routePlanSummary(cu){
  const groups={};
  const days=['월','화','수','목','금','토','일'];
  if(cu.routePlans){
    days.forEach(d=>{
      const r=cu.routePlans[d];
      if(r&&r.driverId){
        const key=r.driverId+'__'+Number(r.order||cu.routeOrder||999);
        groups[key]=groups[key]||{days:[],driverId:r.driverId,order:Number(r.order||cu.routeOrder||999)};
        groups[key].days.push(d);
      }
    });
  }
  const parts=Object.values(groups).map(g=>`${g.days.join('')} ${u(g.driverId).name||g.driverId} ${g.order}번`);
  if(!parts.length&&cu.defaultDriverId) parts.push(`${cu.days||'-'} ${u(cu.defaultDriverId).name||cu.defaultDriverId} ${Number(cu.routeOrder)||'-'}번`);
  return parts.length?parts.join(' · '):'미배정';
}
function routeDaysOrder(){return ['월','화','수','목','금','토','일']}
function plansToDays(plans){return routeDaysOrder().filter(d=>plans&&plans[d]).join('')}
function firstPlanInfo(plans){const d=routeDaysOrder().find(x=>plans&&plans[x]); return d?plans[d]:null}
function samePlan(a,b){return !!a&&!!b&&a.driverId===b.driverId&&Number(a.order)===Number(b.order)}
function driverDayChecksHtml(prefix,selectedPlans={}){
  return `<div class="driverDaySelectBox">${activeDrivers().map(dr=>{
    const checked=routeDaysOrder().filter(d=>selectedPlans?.[d]?.driverId===dr.id);
    return `<div class="driverDaySelectRow"><div class="driverDayName">${htmlSafe(dr.name)}</div><div class="driverDayChecks">${routeDaysOrder().map(d=>`<label><input type="checkbox" name="${prefix}_${dr.id}" value="${d}" ${checked.includes(d)?'checked':''}>${d}</label>`).join('')}</div></div>`;
  }).join('')}</div>`;
}
function collectDriverDayPlans(prefix,order){
  const plans={};
  activeDrivers().forEach(dr=>{
    document.querySelectorAll(`input[name="${prefix}_${dr.id}"]:checked`).forEach(ch=>{
      plans[ch.value]={driverId:dr.id,order:Number(order)||999};
    });
  });
  return plans;
}
function normalizeAllRouteOrders(){
  const groups={};
  db.customers.forEach(cu=>{
    if(!cu.routePlans)return;
    routeDaysOrder().forEach(d=>{
      const p=cu.routePlans[d];
      if(p&&p.driverId){
        const key=d+'__'+p.driverId;
        groups[key]=groups[key]||[];
        groups[key].push({cu,p,day:d});
      }
    });
  });
  Object.values(groups).forEach(arr=>{
    arr.sort((a,b)=>(Number(a.p.order)||9999)-(Number(b.p.order)||9999)||String(a.cu.name).localeCompare(String(b.cu.name),'ko'));
    arr.forEach((x,i)=>{x.cu.routePlans[x.day].order=i+1});
  });
  db.customers.forEach(cu=>{
    const first=firstPlanInfo(cu.routePlans||{});
    cu.days=plansToDays(cu.routePlans||{});
    cu.defaultDriverId=first?.driverId||'';
    cu.routeOrder=Number(first?.order)||999;
  });
}
function setCustomerRoutePlansWithShift(cu,newPlans){
  const oldPlans=JSON.parse(JSON.stringify(cu.routePlans||{}));
  routeDaysOrder().forEach(d=>{
    const np=newPlans?.[d], op=oldPlans?.[d];
    if(!np||samePlan(np,op))return;
    const newOrder=Number(np.order)||999;
    db.customers.forEach(other=>{
      if(other.id===cu.id||other.active===false||!other.routePlans?.[d])return;
      const p=other.routePlans[d];
      if(p.driverId===np.driverId && Number(p.order)>=newOrder) p.order=Number(p.order)+1;
    });
  });
  cu.routePlans=JSON.parse(JSON.stringify(newPlans||{}));

function getRegion(addr){
 addr=String(addr||'').trim();
 if(!addr)return '기타';
 let parts=addr.split(/\s+/).filter(Boolean);
 let first=parts[0]||'';
 let city=first.replace('광역시','').replace('특별시','').replace('특별자치시','').replace('특별자치도','').replace('도','');
 if(['인천','서울','부천','시흥','김포','고양','일산'].includes(city)===false && first.endsWith('시')) city=first;
 let district='';
 for(let i=1;i<parts.length;i++){
   if(/[구군시]$/.test(parts[i])){district=parts[i]; break}
 }
 if(!district && parts[1] && !/[동읍면리]$/.test(parts[1])) district=parts[1];
 if(city && district) return city+' '+district;
 return city||first||'기타';
}

function htmlSafe(v){return String(v??'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function baseSalaryMonth(){return String(new Date().getFullYear())+'-01'}
function normalizeSalaryHistory(d){
 if(!d || d.role!=='driver') return [];
 if(!Array.isArray(d.salaryHistory) || !d.salaryHistory.length){
   d.salaryHistory=[{startMonth:baseSalaryMonth(),salary:Number(d.monthlySalary||0),allowance:Number(d.allowance||0)}];
 }
 d.salaryHistory=d.salaryHistory.map(h=>({startMonth:h.startMonth||baseSalaryMonth(),salary:Number(h.salary||0),allowance:Number(h.allowance||0)})).sort((a,b)=>a.startMonth.localeCompare(b.startMonth));
 return d.salaryHistory;
}
function salaryForMonth(d,m){
 const hist=normalizeSalaryHistory(d); if(!hist.length) return {salary:Number(d?.monthlySalary||0),allowance:Number(d?.allowance||0)};
 let picked=hist[0]; hist.forEach(h=>{if(String(h.startMonth)<=String(m)) picked=h});
 return {salary:Number(picked.salary||0),allowance:Number(picked.allowance||0)};
}
function salaryHistoryText(d){
 const hist=normalizeSalaryHistory(d);
 return hist.map(h=>`${h.startMonth}부터 월급 ${money(h.salary)} · 수당 ${money(h.allowance)}`).join('<br>');
}

function workHistoryText(d){

 if(!events.length)return '저장된 중단/퇴사 이력이 없습니다.';
 return events.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(e=>`${htmlSafe(e.date||'-')} · ${htmlSafe(e.type||'기록')} · ${htmlSafe(e.memo||'메모 없음')}`).join('<br>');
}

function getExpense(m){

 ex.factories=Array.isArray(ex.factories)?ex.factories:[{name:'공장 처리비',region:'',liter:0,km:0,amount:Number(ex.factory||0)}];
 ex.factories=ex.factories.map(f=>({name:f.name||'공장 처리비',region:f.region||f.location||'',liter:Number(f.liter||0),km:Number(f.km||f.distance||0),amount:Number(f.amount||0)}));
 ex.admin=Number(ex.admin||0); ex.other=Number(ex.other||0); ex.memo=ex.memo||'';
 if(!Array.isArray(ex.miscItems)){
   ex.miscItems=[];
   if(ex.admin) ex.miscItems.push({place:'사무·관리',memo:'기존 사무실·관리 비용',amount:Number(ex.admin||0)});
   if(ex.other) ex.miscItems.push({place:'기타',memo:'기존 기타 비용',amount:Number(ex.other||0)});
 }
 ex.miscItems=ex.miscItems.map(x=>({place:x.place||'',memo:x.memo||'',amount:Number(x.amount||0)}));
 const drivers=activeDriverUsers();
 const oldPayroll=Array.isArray(ex.driverPayrolls)?ex.driverPayrolls:[];
 ex.driverPayrolls=drivers.map(d=>{let old=oldPayroll.find(x=>x.driverId===d.id)||{}, base=salaryForMonth(d,m); return {driverId:d.id,salary:Number(old.manual?old.salary:base.salary),allowance:Number(old.manual?old.allowance:base.allowance),manual:!!old.manual,memo:old.memo||''}});
 const oldVehicles=Array.isArray(ex.vehicleCosts)?ex.vehicleCosts:[];
 ex.vehicleCosts=drivers.map(d=>{let old=oldVehicles.find(x=>x.driverId===d.id)||{}; return {driverId:d.id,vehicleName:old.vehicleName!==undefined?old.vehicleName:(d.vehicleName||''),fuel:Number(old.fuel||0),maintenance:Number(old.maintenance!==undefined?old.maintenance:(old.repair||0)),insurance:Number(old.insurance||0),other:Number(old.other||0),memo:old.memo||''}});
 db.expenses[m]=ex; return ex
}

function payrollTotal(e){return (e.driverPayrolls||[]).reduce((s,x)=>s+Number(x.salary||0)+Number(x.allowance||0),0)}
function vehicleFuelTotal(e){return (e.vehicleCosts||[]).reduce((s,x)=>s+Number(x.fuel||0),0)}
function vehicleMaintainTotal(e){return (e.vehicleCosts||[]).reduce((s,x)=>s+Number(x.maintenance||0)+Number(x.insurance||0)+Number(x.other||0),0)}
function vehicleCostsTotal(e){return vehicleFuelTotal(e)+vehicleMaintainTotal(e)}
function driverVehicleTotal(e){return payrollTotal(e)+vehicleCostsTotal(e)}
function miscTotal(e){return (e.miscItems||[]).reduce((s,x)=>s+Number(x.amount||0),0)}
function expTotal(e){return factoryTotal(e)+driverVehicleTotal(e)+miscTotal(e)}
function factoryUnit(f){return Number(f.liter||0)?Number(f.amount||0)/Number(f.liter||0):0}
function factoryBest(e){let list=(e.factories||[]).filter(f=>Number(f.amount||0)>0||Number(f.liter||0)>0); if(!list.length)return null; return list.slice().sort((a,b)=>{let au=factoryUnit(a)||999999, bu=factoryUnit(b)||999999; return au-bu || Number(a.km||0)-Number(b.km||0)})[0]}

function syncFuelExpenseFromLogs(m){
 db.fuelLogs=db.fuelLogs||[];
 let logs=fuelLogsForMonth(m);
 if(!logs.length)return;
 let e=getExpense(m);
 activeDriverUsers().forEach(d=>{
   let sum=logs.filter(x=>x.driverId===d.id).reduce((s,x)=>s+Number(x.cost||0),0);
   let row=(e.vehicleCosts||[]).find(x=>x.driverId===d.id);
   if(row)row.fuel=sum;
 });
 e.fuel=vehicleFuelTotal(e);
 save();
}

function drawBusiness(){
 let m=document.getElementById('bizMonth')?.value||month, pm=prevMonth(m);
 let rows=periodRows('month',m), prevRows=periodRows('month',pm), yrows=periodRows('year',m.slice(0,4));
 const sum=rs=>rs.reduce((s,x)=>s+calc(c(x.customerId),x.liter),0);
 const uniq=rs=>new Set(rs.map(x=>x.customerId)).size;
 const vol=rs=>rs.reduce((s,x)=>s+Number(x.liter||0),0);
 let monthSales=sum(rows), prevSales=sum(prevRows), yearSales=sum(yrows); syncFuelExpenseFromLogs(m);
 let e=getExpense(m), pe=getExpense(pm);
 let expense=expTotal(e), prevExpense=expTotal(pe), net=monthSales-expense, prevNet=prevSales-prevExpense;
 let totalLiter=vol(rows), activeCustomers=uniq(rows);
 let region={}, driver={};
 rows.forEach(x=>{
   let cu=c(x.customerId), rg=getRegion(cu.addr), dn=u(x.driverId).name||x.driverId||'미지정';
   region[rg]=region[rg]||{cnt:new Set(),visits:0,liter:0,sales:0};
   region[rg].cnt.add(x.customerId);
   region[rg].visits++;
   region[rg].liter+=Number(x.liter)||0;
   region[rg].sales+=calc(cu,x.liter);
   driver[dn]=driver[dn]||{customers:new Set(),visits:0,liter:0,sales:0};
   driver[dn].customers.add(x.customerId);
   driver[dn].visits++;
   driver[dn].liter+=Number(x.liter)||0;
   driver[dn].sales+=calc(cu,x.liter);
 });
 let rRows=Object.entries(region).sort((a,b)=>b[1].cnt.size-a[1].cnt.size || b[1].visits-a[1].visits || b[1].sales-a[1].sales);
 let dRows=Object.entries(driver).sort((a,b)=>b[1].visits-a[1].visits || b[1].customers.size-a[1].customers.size || b[1].sales-a[1].sales);
 let margin=monthSales?net/monthSales*100:0, avgCustomer=activeCustomers?monthSales/activeCustomers:0, avgLiter=totalLiter?monthSales/totalLiter:0;
 let processRate=monthSales?factoryTotal(e)/monthSales*100:0, fuelRate=monthSales?vehicleFuelTotal(e)/monthSales*100:0;
 let monthly=[];
 for(let i=5;i>=0;i--){
   let [yy,mm]=m.split('-').map(Number); mm-=i;
   while(mm<=0){yy--;mm+=12}
   let key=yy+'-'+String(mm).padStart(2,'0'), rs=periodRows('month',key), ex=getExpense(key), sales=sum(rs), profit=sales-expTotal(ex);
   monthly.push({key,label:String(mm)+'월',profit,sales});
 }
 let maxProfit=Math.max(...monthly.map(x=>Math.max(1,x.profit)));
 const regionTable=`<div class="bizReviewCard"><div class="bizReviewHead"><div><h3>지역별 검토</h3><p>주소를 시·구 기준으로 묶고, 업체 수가 많은 순서대로 정리합니다.</p></div><span class="bizReviewBadge">업체수 기준</span></div><table class="bizReviewTable"><tr><th style="width:42px">순위</th><th>시·구</th><th>업체</th><th>수거량</th><th>매출</th></tr>${rRows.map(([k,v],i)=>`<tr><td><span class="bizRank ${i<3?'top':''}">${i+1}</span></td><td><div class="bizRegionName">${k}</div><div class="bizSubMetric">${v.visits}회 수거</div></td><td>${v.cnt.size}곳</td><td>${liter(v.liter)}</td><td class="bizMoney">${money(v.sales)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">해당 월 데이터 없음</td></tr>'}</table></div>`;
 const driverTable=`<div class="bizReviewCard"><div class="bizReviewHead"><div><h3>기사별 검토</h3><p>기사별 방문 수, 담당 업체 수, 수거량과 매출을 비교합니다.</p></div><span class="bizReviewBadge">방문수 기준</span></div><table class="bizReviewTable"><tr><th style="width:42px">순위</th><th>기사</th><th>업체</th><th>수거량</th><th>매출</th></tr>${dRows.map(([k,v],i)=>`<tr><td><span class="bizRank ${i<3?'top':''}">${i+1}</span></td><td><div class="bizDriverName">${k}</div><div class="bizSubMetric">${v.visits}회 방문</div></td><td>${v.customers.size}곳</td><td>${liter(v.liter)}</td><td class="bizMoney">${money(v.sales)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">해당 월 데이터 없음</td></tr>'}</table></div>`;
 businessOut.innerHTML=`<div class="grid card"><div class="kpi"><div class="muted">매출</div><b>${money(monthSales)}</b><div class="${pctClass(monthSales,prevSales,true)}">지난달 대비 ${pct(monthSales,prevSales)}</div></div><div class="kpi"><div class="muted">총 지출</div><b id="kpiExpenseNow">${money(expense)}</b><div class="${pctClass(expense,prevExpense,false)}">지난달 대비 ${pct(expense,prevExpense)}</div></div><div class="profitBox"><div class="muted">순수익</div><b id="kpiNetNow" style="font-size:26px">${money(net)}</b><div class="${pctClass(net,prevNet,true)}">지난달 대비 ${pct(net,prevNet)}</div><div class="quickHint">순이익률 ${margin.toFixed(1)}%</div></div><div class="kpi"><div class="muted">수거 업체 / 수거량</div><b>${activeCustomers}곳</b><div class="muted">${liter(totalLiter)}</div></div></div><div class="card"><h3>한눈에 보는 손익 분석</h3><div class="compareBox"><div class="compareItem"><div class="muted">업체당 평균 매출</div><b>${money(avgCustomer)}</b></div><div class="compareItem"><div class="muted">리터당 평균 매출</div><b>${Math.round(avgLiter).toLocaleString('ko-KR')}원/L</b></div><div class="compareItem"><div class="muted">처리비 비율</div><b>${processRate.toFixed(1)}%</b></div><div class="compareItem"><div class="muted">유류비 비율</div><b>${fuelRate.toFixed(1)}%</b></div><div class="compareItem"><div class="muted">연 누적 매출</div><b>${money(yearSales)}</b></div></div></div><div class="card"><h3>올해 최근 6개월 순수익</h3><div class="chartBox">${monthly.map(x=>`<div class="chartCol"><div class="chartBar" style="height:${Math.max(4,(x.profit/maxProfit*130))}px"></div><div class="chartLabel">${x.label}</div><div class="chartLabel">${Math.round(x.profit/10000).toLocaleString()}만</div></div>`).join('')}</div></div><div class="bizReviewWrap">${regionTable}${driverTable}</div>${driverRunAdminPanel(m)}${expenseInputs(e)}`
}

 e.vehicleCosts=(e.vehicleCosts||[]).map((r,i)=>({driverId:r.driverId,vehicleName:document.getElementById('carName'+i)?.value||'',fuel:Number(document.getElementById('carFuel'+i)?.value||0),maintenance:Number(document.getElementById('carMaintenance'+i)?.value||0),insurance:Number(document.getElementById('carInsurance'+i)?.value||0),other:Number(document.getElementById('carOther'+i)?.value||0)}));
 e.payroll=payrollTotal(e); e.fuel=vehicleFuelTotal(e); e.vehicle=vehicleMaintainTotal(e); e.insurance=0;
 let miscItems=[];

 e.miscItems=miscItems; e.admin=0; e.other=0; e.memo=document.getElementById('exMemo')?.value||''; save();

function normalizeNameForMatch(v){return String(v||'').replace(/고객|대표|님|주식회사|\(주\)|㈜|\s/g,'').toLowerCase()}
function findCustomerForUserName(name){
 const key=normalizeNameForMatch(name);
 if(!key)return null;
 return db.customers.find(cu=>normalizeNameForMatch(cu.name)===key)||db.customers.find(cu=>key.includes(normalizeNameForMatch(cu.name))||normalizeNameForMatch(cu.name).includes(key))||null;
}
function updateAccountRoleHelp(){

 document.querySelectorAll('.driverOnly').forEach(el=>el.classList.toggle('off',role!=='driver'));
 document.querySelectorAll('.customerOnly').forEach(el=>el.classList.toggle('off',role!=='customer'));
 if(!help)return;

 else if(role==='admin') help.textContent='관리자 계정은 전체 화면을 볼 수 있습니다.';
 else help.textContent='기사 계정은 담당 차량과 입사일만 입력합니다. 급여·중단·퇴사 이력은 계정 목록의 버튼에서 관리합니다.';
}

function addUser(){
 if(!uid.value||!upw.value||!unm.value)return alert('아이디/비밀번호/이름을 입력하세요.');
 if(db.users.some(x=>x.id===uid.value.trim()))return alert('이미 있는 아이디입니다.');
 const role=urole.value;
 const item={id:uid.value.trim(),pw:upw.value,role,name:unm.value.trim(),active:true};
 if(role==='driver'){
   item.monthlySalary=0; item.allowance=0; item.vehicleName=uvehicle?.value||''; item.workStart=ustart?.value||''; item.workEnd=''; item.workNote=''; item.workEvents=[]; item.salaryHistory=[{startMonth:month,salary:0,allowance:0}];

}

function compressImageFile(file,done){
 const reader=new FileReader();
 reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
     const max=1400;
     let w=img.width,h=img.height;
     if(Math.max(w,h)>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
     const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
     const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
     done(canvas.toDataURL('image/jpeg',0.78),'image/jpeg');
   };
   img.onerror=()=>done(reader.result,file.type||'image/*');
   img.src=reader.result;
 };
 reader.readAsDataURL(file);
}

function filterRowsByCustomer(rows,q){
  q=String(q||'').trim().toLowerCase();

  return rows.filter(r=>{

    return [cu.name,cu.owner,cu.phone,cu.email,cu.addr,r.status,r.memo].join(' ').toLowerCase().includes(q);
  });
}

function ensureCmsData(){db.cmsPayments=Array.isArray(db.cmsPayments)?db.cmsPayments:[]}

function getCms(m,cid){ensureCmsData(); return db.cmsPayments.find(x=>x.month===m&&x.customerId===cid)||null}
function setCms(m,cid,data){
  ensureCmsData();
  let idx=db.cmsPayments.findIndex(x=>x.month===m&&x.customerId===cid);
  let old=idx>=0?db.cmsPayments[idx]:null;
  let rec={month:m,customerId:cid,status:data.status||'대기',expected:Number(data.expected||0),paid:Number(data.paid||0),memo:data.memo||'',paidAt:data.paidAt||'',updatedAt:new Date().toISOString(),updatedBy:me?.id||''};
  if(idx>=0) db.cmsPayments[idx]=rec; else db.cmsPayments.push(rec);
  if(typeof addChangeLog==='function') addChangeLog({type:'cms_update',customerId:cid,customerName:c(cid)?.name||cid,detail:`CMS ${m} ${rec.status} / ${rec.paid}원`,reason:rec.memo||''});
}
function cmsStatusClass(st){return st==='출금완료'?'pill ok':st==='부분출금'?'pill wait':st==='미납'?'pill bad':'pill'}
function cmsRows(m){
  ensureCmsData();
  return ledgerRows(m).map(r=>{
    const saved=getCms(m,r.cu.id);
    const expected=Number(saved?.expected ?? r.totalA ?? 0);
    const paid=Number(saved?.paid ?? 0);
    const status=saved?.status || (paid>=expected&&expected>0?'출금완료':paid>0?'부분출금':'대기');
    return { ...r, cms:saved, expected, paid, status, remain:Math.max(0, expected-paid), memo:saved?.memo||'', paidAt:saved?.paidAt||'' };
  });
}

function ledgerRows(m){return db.customers.map(cu=>{let ps=db.pickups.filter(x=>x.customerId===cu.id&&x.date.startsWith(m)&&x.status==='done').sort((a,b)=>a.date.localeCompare(b.date)); return {cu,ps,totalL:ps.reduce((s,x)=>s+Number(x.liter||0),0),totalA:ps.reduce((s,x)=>s+calc(cu,x.liter),0)}}).filter(r=>r.ps.length)}
function ledgerText(r,m){let lines=[]; lines.push(`[NEP 음식물류 폐기물 수거 관리대장]`); lines.push(`${m} 수거내역`); lines.push(''); lines.push('수거일 / 기사 / 수거량 / 금액'); r.ps.forEach(x=>lines.push(`${x.date} / ${u(x.driverId).name||x.driverId} / ${liter(x.liter)} / ${money(calc(r.cu,x.liter))}`)); lines.push(''); lines.push(`합계 수거량: ${liter(r.totalL)}`); lines.push(`합계 금액: ${money(r.totalA)}`); return lines.join('\n')}

function xlsEscape(v){return String(v??'').replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))}
function sheetNameSafe(v){return String(v||'Sheet').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31)||'Sheet'}
function xlsCell(v,style='sText',type){
  if(v===null||v===undefined)v='';
  let isNum=type==='Number'||(type!== 'String' && typeof v==='number');
  let t=isNum?'Number':'String';
  return `<Cell ss:StyleID="${style}"><Data ss:Type="${t}">${xlsEscape(v)}</Data></Cell>`;
}
function xlsMerged(v,merge,style='sTitle'){return `<Cell ss:MergeAcross="${merge}" ss:StyleID="${style}"><Data ss:Type="String">${xlsEscape(v)}</Data></Cell>`}
function xlsRow(cells,height=''){
  return `<Row${height?` ss:Height="${height}"`:''}>${cells.map(c=>{
    if(typeof c==='string')return xlsCell(c);
    if(typeof c==='number')return xlsCell(c,'sNum','Number');
    if(c&&c.merge!==undefined)return xlsMerged(c.v,c.merge,c.s||'sTitle');
    return xlsCell(c?.v??'',c?.s||'sText',c?.t);
  }).join('')}</Row>`;
}
function xlsSheet(name,rows,widths=[80,110,110,110,110,120,140,160]){
  let cols=widths.map(w=>`<Column ss:AutoFitWidth="0" ss:Width="${w}"/>`).join('');
  return `<Worksheet ss:Name="${xlsEscape(sheetNameSafe(name))}"><Table>${cols}${rows.join('')}</Table></Worksheet>`;
}

function startDriverRun(){
  const s = getDriverState();
  const rows = driverRowsToday();
  s.started = true;
  s.mode = 'route';
  s.currentIndex = Math.min(Math.max(driverFirstUnfinishedIndex(rows), 0), Math.max(rows.length-1, 0));
  saveDriverState();
  renderDriver();
}
function prevDriverStop(){
  const s = getDriverState();
  const rows = driverRowsToday();
  s.currentIndex = Math.max(0, Number(s.currentIndex||0)-1);
  s.mode = 'route';
  if(rows.length===0) s.currentIndex = 0;
  saveDriverState();
  renderDriver();
}
function nextDriverStop(){
  const s = getDriverState();
  const rows = driverRowsToday();
  s.currentIndex = Math.min(Math.max(rows.length-1,0), Number(s.currentIndex||0)+1);
  s.mode = 'route';
  saveDriverState();
  renderDriver();
}
function openFuelScreen(){
  const s = getDriverState();
  s.mode = 'fuel';
  saveDriverState();
  renderDriver();
}
function backToRouteScreen(){
  const s = getDriverState();
  s.mode = 'route';
  saveDriverState();
  renderDriver();
}

  return 'https://map.naver.com/v5/search/' + encodeURIComponent(addr || '');
}

  }

    driverView.innerHTML = `
      <div class="driverRunHero">
        <div class="driverRunCard driverStartBox">
          <h2>오늘 수거를 시작할까요?</h2>

function playPickupCompleteSound(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    const notes = [660, 880];
    notes.forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i*0.11);
      gain.gain.setValueAtTime(0.0001, now + i*0.11);
      gain.gain.exponentialRampToValueAtTime(0.18, now + i*0.11 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.11 + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i*0.11);
      osc.stop(now + i*0.11 + 0.13);
    });
    setTimeout(()=>ctx.close&&ctx.close(), 500);
  }catch(e){}
}

function savePickup(cid, st){
  if(isMonthClosed(today.slice(0,7)) && me.role!=='admin'){
    alert('이번 달은 월마감 처리되어 기사 입력이 차단되었습니다. 관리자에게 문의하세요.');
    return;
  }
  if(st==='done') playPickupCompleteSound();
  const idx = db.pickups.findIndex(x=>x.date===today && x.customerId===cid);
  const oldRec = idx>=0 ? JSON.parse(JSON.stringify(db.pickups[idx])) : null;
  const now = new Date();
  const litEl = document.getElementById('lit-'+cid);
  const memEl = document.getElementById('mem-'+cid);
  const cu = c(cid);

  const rec = {
    date: today,
    driverId: me.id,
    customerId: cid,
    status: st,
    liter: st==='done' ? (Number(litEl?.value||0) || 0) : 0,
    memo: memEl?.value || '',
    time: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0')
  };

  if(oldRec){
    const changed = String(oldRec.status)!==String(rec.status) || Number(oldRec.liter||0)!==Number(rec.liter||0) || String(oldRec.memo||'')!==String(rec.memo||'');
    if(changed){
      const reason = prompt('기존 수거기록을 수정합니다. 수정 사유를 입력하세요.','기사 입력 수정') || '기사 입력 수정';
      addChangeLog({type:'pickup_update',customerId:cid,customerName:cu?.name||cid,oldStatus:oldRec.status,oldLiter:Number(oldRec.liter||0),oldMemo:oldRec.memo||'',newStatus:rec.status,newLiter:Number(rec.liter||0),newMemo:rec.memo||'',reason});
    }
  }else{
    addChangeLog({type:'pickup_create',customerId:cid,customerName:cu?.name||cid,newStatus:rec.status,newLiter:Number(rec.liter||0),newMemo:rec.memo||'',reason:'신규 입력'});
  }

  if(idx>=0) db.pickups[idx]=rec; else db.pickups.push(rec);

  const s = getDriverState();
  const rows = driverRowsToday();
  const current = Number(s.currentIndex||0);
  const unfinished = driverFirstUnfinishedIndex(rows);

  if(unfinished>=rows.length && current>=rows.length-1){
    s.mode='factory';
  }else if(current<rows.length-1){
    s.currentIndex=current+1;
    s.mode='route';
  }else if(unfinished<rows.length){
    s.currentIndex=unfinished;
    s.mode='route';
  }

  saveDriverState();
  renderDriver();
}

function addFuelLog(){
  const station = document.getElementById('fuelStation')?.value.trim() || '';
  const amountLiter = Number(document.getElementById('fuelLiter')?.value || 0);
  const cost = Number(document.getElementById('fuelCost')?.value || 0);
  const memo = document.getElementById('fuelMemo')?.value || '';
  if(!station || !amountLiter || !cost) return alert('주유소 이름, 주유량, 주유비를 입력하세요.');

  const now = new Date();
  db.fuelLogs = db.fuelLogs || [];
  db.fuelLogs.push({
    date: today,
    driverId: me.id,
    station,
    amountLiter,
    cost,
    memo,
    time: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0')
  });
  syncFuelExpenseFromLogs(today.slice(0,7));
  save();
  renderDriverFuelScreen();
}
function updateFuelLog(i){
  const x = db.fuelLogs?.[i];
  if(!x) return;
  x.station = document.getElementById('fuelStationEdit'+i)?.value || '';
  x.amountLiter = Number(document.getElementById('fuelLiterEdit'+i)?.value || 0);
  x.cost = Number(document.getElementById('fuelCostEdit'+i)?.value || 0);
  x.memo = document.getElementById('fuelMemoEdit'+i)?.value || '';
  syncFuelExpenseFromLogs(today.slice(0,7));
  save();
  renderDriverFuelScreen();
}
function deleteFuelLog(i){
  if(!confirm('주유 기록을 삭제할까요?')) return;
  db.fuelLogs.splice(i,1);
  syncFuelExpenseFromLogs(today.slice(0,7));
  save();
  renderDriverFuelScreen();
}

function calcFactoryNet(){
  const g = Number(document.getElementById('grossWeight')?.value || 0);
  const t = Number(document.getElementById('tareWeight')?.value || 0);
  const n = document.getElementById('netWeight');
  if(n) n.value = (g && t) ? Math.max(0, g-t) : '';
}

/* v19: 정보수정 최종 안정화 + 순번 전역 중복 제거 */
(function(){
  const DAYS=['월','화','수','목','금','토','일'];

  window.v19Days = function(){ return DAYS.slice(); };

  window.v19PlansToDays = function(plans){
    return DAYS.filter(d=>plans&&plans[d]).join('');
  };

  window.v19FirstPlan = function(plans){
    const d=DAYS.find(x=>plans&&plans[x]);
    return d?plans[d]:null;
  };

  window.v19DriverDayChecksHtml = function(prefix, selectedPlans={}){
    return `<div class="driverDaySelectBox">${activeDrivers().map(dr=>{
      const checked=DAYS.filter(d=>selectedPlans?.[d]?.driverId===dr.id);
      return `<div class="driverDaySelectRow">
        <div class="driverDayName">${htmlSafe(dr.name)}</div>
        <div class="driverDayChecks">${DAYS.map(d=>`<label><input type="checkbox" name="${prefix}_${dr.id}" value="${d}" ${checked.includes(d)?'checked':''}>${d}</label>`).join('')}</div>
      </div>`;
    }).join('')}</div>`;
  };

  window.v19CollectDriverDayPlans = function(prefix, order){
    const plans={};
    activeDrivers().forEach(dr=>{
      document.querySelectorAll(`input[name="${prefix}_${dr.id}"]:checked`).forEach(ch=>{
        plans[ch.value]={driverId:dr.id,order:Number(order)||9999};
      });
    });
    return plans;
  };

  window.v19NormalizeAllRouteOrders = function(){
    const dayGroups={};
    db.customers.forEach(cu=>{
      if(!cu.routePlans)return;
      DAYS.forEach(d=>{
        const p=cu.routePlans[d];
        if(p&&p.driverId){
          dayGroups[d]=dayGroups[d]||[];
          dayGroups[d].push({cu,p,day:d});
        }
      });
    });

    Object.values(dayGroups).forEach(arr=>{
      arr.sort((a,b)=>{
        const ao=Number(a.p.order)||9999;
        const bo=Number(b.p.order)||9999;
        if(ao!==bo)return ao-bo;
        const ad=u(a.p.driverId).name||a.p.driverId||'';
        const bd=u(b.p.driverId).name||b.p.driverId||'';
        return ad.localeCompare(bd,'ko')||String(a.cu.name).localeCompare(String(b.cu.name),'ko');
      });
      arr.forEach((x,i)=>{ x.cu.routePlans[x.day].order=i+1; });
    });

    db.customers.forEach(cu=>{
      cu.days=v19PlansToDays(cu.routePlans||{});
      const first=v19FirstPlan(cu.routePlans||{});
      cu.defaultDriverId=first?.driverId||'';
      cu.routeOrder=Number(first?.order)||9999;
    });
  };

  window.v19SetRoutePlansWithShift = function(cu,newPlans){
    const oldPlans=JSON.parse(JSON.stringify(cu.routePlans||{}));

    DAYS.forEach(d=>{
      const np=newPlans?.[d];
      const op=oldPlans?.[d];
      if(!np)return;

      const oldSame = op && op.driverId===np.driverId && Number(op.order)===Number(np.order);
      if(oldSame)return;

      const insertOrder=Number(np.order)||9999;

      db.customers.forEach(other=>{
        if(other.id===cu.id || other.active===false || !other.routePlans?.[d])return;
        const p=other.routePlans[d];
        if(Number(p.order)>=insertOrder){
          p.order=Number(p.order)+1;
        }
      });
    });

    cu.routePlans=JSON.parse(JSON.stringify(newPlans||{}));
    v19NormalizeAllRouteOrders();
  };

  // 기존 이름으로도 덮어씌워서 기존 버튼/함수가 새 로직을 쓰게 함
  window.normalizeAllRouteOrders = v19NormalizeAllRouteOrders;
  window.setCustomerRoutePlansWithShift = v19SetRoutePlansWithShift;
  window.plansToDays = v19PlansToDays;
  window.firstPlanInfo = v19FirstPlan;
  window.driverDayChecksHtml = v19DriverDayChecksHtml;
  window.collectDriverDayPlans = v19CollectDriverDayPlans;

  window.routePlanSummary = function(cu){
    const groups={};
    if(cu.routePlans){
      DAYS.forEach(d=>{
        const r=cu.routePlans[d];
        if(r&&r.driverId){
          const key=r.driverId+'__'+Number(r.order||9999);
          groups[key]=groups[key]||{days:[],driverId:r.driverId,order:Number(r.order||9999)};
          groups[key].days.push(d);
        }
      });
    }
    const parts=Object.values(groups).map(g=>`${g.days.join('')} ${u(g.driverId).name||g.driverId} ${g.order}번`);
    if(!parts.length&&cu.defaultDriverId) parts.push(`${cu.days||'-'} ${u(cu.defaultDriverId).name||cu.defaultDriverId} ${Number(cu.routeOrder)||'-'}번`);
    return parts.length?parts.join(' · '):'미배정';
  };

  window.routePlanFor = function(cu,d){
    const dk=dayKo(d);
    if(cu.routePlans&&cu.routePlans[dk])return cu.routePlans[dk];
    if(cu.defaultDriverId)return {driverId:cu.defaultDriverId,order:Number(cu.routeOrder)||9999};
    return null;
  };

  window.customerOrderNo = function(cu){
    const r=routePlanFor(cu,today);
    return Number(r?.order||cu.routeOrder||9999);
  };

  window.customerDriverName = function(cu){
    const r=routePlanFor(cu,today);
    const id=r?.driverId||cu.defaultDriverId||'';
    return id?(u(id).name||id):'미배정';
  };

  window.rebuildAssignmentsForDateFromRules = function(d=today,quiet=false){
    const before=db.assignments.filter(a=>a.date===d).length;
    db.assignments=db.assignments.filter(a=>a.date!==d);
    let rows=[];
    activeDrivers().forEach(dr=>{
      activeCustomersForDay(dr.id,d).forEach(cu=>{
        const rp=routePlanFor(cu,d);
        rows.push({date:d,driverId:dr.id,customerId:cu.id,order:Number(rp?.order)||9999,auto:true});
      });
    });
    rows.sort((a,b)=>a.order-b.order||String(u(a.driverId).name||a.driverId).localeCompare(String(u(b.driverId).name||b.driverId),'ko'));
    db.assignments.push(...rows);
    if(typeof addChangeLog==='function' && before!==rows.length){
      addChangeLog({type:'assign_auto',detail:`${d} ${dayKo(d)}요일 오늘배정 자동정리: ${before}곳 → ${rows.length}곳`});
    }
    if(!quiet)alert(`${d} ${dayKo(d)}요일 오늘배정 ${rows.length}곳을 중복 없는 순번으로 정리했습니다.`);
    return rows.length;
  };

  window.buildRouteForDriver = function(did,d,ask){
    if(!d)return alert('날짜를 선택하세요');
    v19NormalizeAllRouteOrders();
    const list=activeCustomersForDay(did,d);
    if(!list.length){
      if(ask)alert(`${dayKo(d)}요일 ${u(did).name} 자동 배정 업체가 없습니다.`);
      return 0;
    }
    if(ask&&!confirm(`${d} ${dayKo(d)}요일 코스를 ${u(did).name}에게 ${list.length}곳 자동 배정할까요? 기존 해당 날짜 코스는 교체됩니다.`))return 0;
    db.assignments=db.assignments.filter(a=>!(a.date===d&&a.driverId===did));
    list.forEach(cu=>{
      const rp=routePlanFor(cu,d);
      db.assignments.push({date:d,driverId:did,customerId:cu.id,order:Number(rp?.order)||9999,auto:true});
    });
    return list.length;
  };

    <div class="accountModalBody"><div class="accountModalGrid">

    const x=db.customers[i];
    if(!x)return alert('업체 정보를 찾을 수 없습니다.');
    const name=document.getElementById('v19CuName'+i)?.value.trim();
    if(!name)return alert('업체명을 입력하세요.');
    const order=Number(document.getElementById('v19CuOrder'+i)?.value)||9999;
    const plans=v19CollectDriverDayPlans('v19EditDays'+i,order);
    const days=v19PlansToDays(plans);
    if(!days)return alert('기사별 수거요일을 1개 이상 선택하세요.');

    const before=x.name;
    x.name=name;
    x.owner=document.getElementById('v19CuOwner'+i)?.value||'';
    x.phone=document.getElementById('v19CuPhone'+i)?.value||'';
    x.email=document.getElementById('v19CuEmail'+i)?.value||'';
    x.addr=document.getElementById('v19CuAddr'+i)?.value||'';

    x.binCount=Number(document.getElementById('v19CuBinCount'+i)?.value||1);
    x.deposit=Number(document.getElementById('v19CuDeposit'+i)?.value||0);
    x.includedLiter=Number(document.getElementById('v19CuIncluded'+i)?.value||360);
    x.baseFee=Number(document.getElementById('v19CuBaseFee'+i)?.value||60000);
    x.unitPrice=Number(document.getElementById('v19CuUnit'+i)?.value||130);
    x.memo=document.getElementById('v19CuMemo'+i)?.value||'';

    v19SetRoutePlansWithShift(x,plans);

      addChangeLog({type:'customer_update',customerId:x.id,customerName:x.name,detail:`업체 정보 수정 및 순번 중복 자동정리: ${before} → ${x.name}`});

    if(!cn.value.trim())return alert('업체명을 입력하세요');
    const order=Number(document.getElementById('cro')?.value)||9999;
    const plans=v19CollectDriverDayPlans('addDriverDays',order);
    const selectedDays=v19PlansToDays(plans);
    if(!selectedDays)return alert('기사별 수거요일을 1개 이상 선택하세요.');

    const first=v19FirstPlan(plans);
    const item={
      id:'c'+Date.now(),

      phone:cp.value,
      email:ce.value,

    };

(function(){
  window.ensureAiMeetingData=function(){
    db.aiMeetings=Array.isArray(db.aiMeetings)?db.aiMeetings:[];
  };

  window.aiMeetingMetrics=function(){
    const assigned=db.assignments.filter(a=>a.date===today);
    const done=db.pickups.filter(p=>p.date===today&&p.status==='done');
    const missed=db.pickups.filter(p=>p.date===today&&p.status==='missed');
    const totalLiter=done.reduce((s,x)=>s+Number(x.liter||0),0);
    const rate=assigned.length?Math.round(done.length/assigned.length*100):0;
    const monthRows=ledgerRows(month);
    const monthLiter=monthRows.reduce((s,r)=>s+Number(r.totalL||0),0);
    const monthAmount=monthRows.reduce((s,r)=>s+Number(r.totalA||0),0);
    let unpaid=0, remain=0;
    try{
      const cms=cmsRows(month);
      unpaid=cms.filter(x=>x.status==='미납'||x.status==='부분출금'||x.remain>0).length;
      remain=cms.reduce((s,x)=>s+Number(x.remain||0),0);
    }catch(e){}
    return {assigned:assigned.length,done:done.length,missed:missed.length,totalLiter,rate,monthLiter,monthAmount,unpaid,remain};
  };

  window.aiToneByIdea=function(idea){
    const t=String(idea||'').toLowerCase();
    return {
      money:/비용|돈|수익|매출|요금|단가|미수|cms|할부|차량|증차/.test(t),
      legal:/계약|미납|내용증명|지급명령|구청|민원|신고|올바로|위반|법/.test(t),
      growth:/영업|홍보|블로그|신규|지역|확장|서울|안산|수원|고객/.test(t),
      ops:/수거|기사|코스|순번|배정|차량|통|미수거|세척|공장/.test(t),
      app:/앱|어플|자동|데이터|ai|경영회의|입력|관리/.test(t)

  window.aiSmartMetrics=function(){
    const assignments=db.assignments.filter(a=>a.date===today);
    const done=db.pickups.filter(p=>p.date===today&&p.status==='done');
    const missed=db.pickups.filter(p=>p.date===today&&p.status==='missed');
    const doneIds=new Set(done.map(x=>x.customerId));
    const uninput=assignments.filter(a=>!doneIds.has(a.customerId)&&!missed.some(m=>m.customerId===a.customerId));
    const totalLiter=done.reduce((s,x)=>s+Number(x.liter||0),0);
    const avgLiter=done.length?Math.round(totalLiter/done.length):0;
    const rate=assignments.length?Math.round(done.length/assignments.length*100):0;

    const mRows=ledgerRows(month);
    const monthAmount=mRows.reduce((s,r)=>s+Number(r.totalA||0),0);
    const monthLiter=mRows.reduce((s,r)=>s+Number(r.totalL||0),0);
    let cms=[];
    try{cms=cmsRows(month)}catch(e){}
    const remain=cms.reduce((s,x)=>s+Number(x.remain||0),0);
    const unpaid=cms.filter(x=>x.status==='미납'||x.status==='부분출금'||x.remain>0).length;
    const customers=db.customers.filter(x=>x.active!==false);
    const drivers=db.users.filter(x=>x.role==='driver'&&x.active);
    const driverLoad=drivers.map(d=>{
      const rows=assignments.filter(a=>a.driverId===d.id);
      const dDone=rows.filter(a=>doneIds.has(a.customerId)).length;
      return {driver:d,assigned:rows.length,done:dDone,rate:rows.length?Math.round(dDone/rows.length*100):0};
    });
    const score=Math.max(35,Math.min(95,Math.round(rate*0.45 + (unpaid?55:80)*0.25 + (missed.length?60:88)*0.2 + (customers.length?75:50)*0.1)));
    return {assignments,done,missed,uninput,totalLiter,avgLiter,rate,mRows,monthAmount,monthLiter,cms,remain,unpaid,customers,drivers,driverLoad,score};
  };
